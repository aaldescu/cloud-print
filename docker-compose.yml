# CloudPrint — serverul (modul cloud), pentru rulare cu Docker Compose.
# NU printează (nu are CUPS) — servește interfața web + coada de joburi.
# Printarea o face agentul de pe Raspberry Pi (vezi install-agent.sh).
#
# Pornire:
#   1. cp .env.example .env  și completează parola + tokenul
#   2. docker compose up -d --build
#
# ─────────────────────────────────────────────────────────────────────────────
# RUTARE / HTTPS
#
# Pe DOKPLOY nu publici portul pe gazdă (ar intra în conflict cu proxy-ul —
# „port is already allocated"). În schimb, containerul trebuie să fie pe rețeaua
# `dokploy-network` (acolo e Traefik-ul Dokploy), iar rutarea o faci într-un fel:
#
#   Varianta A (recomandată): adaugi domeniul din UI-ul Dokploy → tab Domains,
#     Service `cloudprint`, Container Port 8080, HTTPS On. Dokploy pune singur
#     etichetele Traefik. (Blocul `labels` de mai jos rămâne comentat.)
#
#   Varianta B: definești rutarea aici — pui CLOUDPRINT_DOMAIN în .env,
#     decomentezi blocul `labels` și NU mai adaugi domeniu în UI.
#
# Pe un VPS FĂRĂ Dokploy: șterge secțiunea `networks` (și `dokploy-network`),
# decomentează blocul `ports`, și pune un reverse proxy cu HTTPS în față.
# ─────────────────────────────────────────────────────────────────────────────

services:
  cloudprint:
    build: .
    image: cloud-print:latest
    restart: unless-stopped
    environment:
      CLOUDPRINT_MODE: cloud
      CLOUDPRINT_DATA_DIR: /data
      # obligatorii — se citesc din fișierul .env (vezi .env.example)
      CLOUDPRINT_PASSWORD: ${CLOUDPRINT_PASSWORD:?seteaza CLOUDPRINT_PASSWORD in .env}
      CLOUDPRINT_AGENT_TOKEN: ${CLOUDPRINT_AGENT_TOKEN:?seteaza CLOUDPRINT_AGENT_TOKEN in .env}
    # portul intern al aplicației, vizibil pentru Traefik pe rețeaua Docker
    expose:
      - "8080"
    networks:
      - dokploy-network
    volumes:
      # date persistente: baza SQLite, fișierele temporare, cheia de sesiune
      - cloudprint-data:/data

    # Varianta B — rutare Traefik definită aici (vezi nota de sus). Setează
    # CLOUDPRINT_DOMAIN în .env și decomentează:
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=dokploy-network
    #   - traefik.http.routers.cloudprint.rule=Host(`${CLOUDPRINT_DOMAIN}`)
    #   - traefik.http.routers.cloudprint.entrypoints=websecure
    #   - traefik.http.routers.cloudprint.tls.certresolver=letsencrypt
    #   - traefik.http.services.cloudprint.loadbalancer.server.port=8080

    # Doar pentru VPS FĂRĂ Dokploy — publică portul pe gazdă (și scoate `networks`):
    # ports:
    #   - "${CLOUDPRINT_HOST_PORT:-8080}:8080"

networks:
  dokploy-network:
    external: true

volumes:
  cloudprint-data:
